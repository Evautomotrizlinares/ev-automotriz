name: Preparar precios EV Automotriz
on:
  workflow_dispatch:
  schedule:
    # 00:00 y 12:00 Chile continental: se ejecuta cada hora y filtra por zona.
    - cron: '0 * * * *'
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automatizacion-precios-derco
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar horario de Chile
        id: horario
        run: |
          HORA=$(TZ=America/Santiago date +%H)
          if [[ "$HORA" == "00" || "$HORA" == "12" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Preparar catálogo desde datos verificados
        if: steps.horario.outputs.ejecutar == 'true'
        run: python scripts/actualizar_precios.py
      - name: Guardar cambios en rama de prueba
        if: steps.horario.outputs.ejecutar == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/catalogo.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar catálogo de precios verificados"
            git push
          fi
